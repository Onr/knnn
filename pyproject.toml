[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knnn"
version = "0.1.0"
description = "Nearest neighbors of neighbors for anomaly detection"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Ori Nizan", email = "restin3@gmail.com"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
keywords = ["knnn", "knn", "embedding", "anomaly-detection"]
dependencies = ["numpy>=1.21", "scikit-learn>=1.2"]

[project.optional-dependencies]
dev = [
  "pytest>=7", "build", "twine", "matplotlib", "seaborn", "pandas",
  "datasets", "tqdm",
]
tests = ["pytest>=7", "matplotlib", "seaborn", "pandas", "datasets", "tqdm"]
faiss = ["faiss-cpu"]

[project.urls]
Homepage = "https://github.com/Onr/knnn"
"Bug Tracker" = "https://github.com/Onr/knnn/issues"

[tool.setuptools.packages.find]
include = ["knnn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "benchmark: comparative algorithm benchmarks rather than correctness tests",
  "external: benchmarks requiring downloaded or local datasets",
]
